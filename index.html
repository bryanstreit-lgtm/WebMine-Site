<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web Launcher</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Imagem de fundo temática do Minecraft */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 40px 60px;
            border: 4px solid #555;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 3px 3px #000;
            letter-spacing: 2px;
        }
        .btn-jogar {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            /* Cores e texturas estilo botões do Minecraft */
            background-color: #47852f;
            border: 3px solid #000;
            border-bottom: 6px solid #2e5c1e;
            cursor: pointer;
            text-shadow: 2px 2px #000;
            transition: all 0.1s ease;
        }
        .btn-jogar:hover {
            background-color: #529a37;
            border-bottom: 6px solid #387024;
        }
        .btn-jogar:active {
            border-bottom-width: 2px;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>EaglercraftX 1.8</h1>
        <!-- target="_blank" faz com que o arquivo abra em uma nova aba -->
        <a href="minecraft.html" target="_blank" class="btn-jogar">JOGAR MINECRAFT</a>
    </div>

</body>
</html>
